<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 110" width="100%" height="100%">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D78A"/>
      <stop offset="50%" stop-color="#E5B869"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(10, 10)">
    <!-- Red Curve of R -->
    <path d="M 15 10 L 45 10 C 65 10, 75 22, 65 42 C 55 58, 35 55, 35 55 L 15 55 Z" fill="url(#redGrad)" />
    <!-- Blue Leg of R -->
    <path d="M 32 45 L 68 85 L 50 85 L 20 50 Z" fill="url(#blueGrad)" />
    <!-- Vertical Bar -->
    <rect x="15" y="10" width="16" height="75" rx="3" fill="url(#redGrad)" />
    <circle cx="50" cy="30" r="6" fill="#F5D78A" />
  </g>

  <!-- Logo Text -->
  <text x="95" y="58" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="44" fill="#E11D48" letter-spacing="-1">Riddhi</text>
  <text x="96" y="80" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12" fill="#1E3A8A" letter-spacing="1.5">VINAYAK BENIFIT NIDHI LTD.</text>
</svg>
